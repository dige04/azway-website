# Render Blueprint for the staging CMS (docs/STAGING.md): Strapi from
# apps/cms/Dockerfile on a free web service, free Postgres, uploads on R2.
# Render passes env vars to `docker build` as build args, so ADMIN_PATH
# reaches `strapi build`. `sync: false` values are asked for once, when the
# Blueprint is created; Strapi's own secrets are generated by Render.
services:
  - type: web
    name: azway-cms-staging
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/cms/Dockerfile
    dockerContext: .
    healthCheckPath: /_health
    buildFilter:
      paths:
        - apps/cms/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
    envVars:
      # Custom admin path (NFR-07), e.g. /quan-tri-<random>; the build fails without it.
      - key: ADMIN_PATH
        sync: false
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_CLIENT
        value: postgres
      # Internal URL: no TLS needed inside Render.
      - key: DATABASE_URL
        fromDatabase:
          name: azway-cms-staging-db
          property: connectionString
      # Render's edge (Cloudflare) overwrites True-Client-IP with the client's
      # address; X-Forwarded-For keeps whatever the client sent.
      - key: SERVER_PROXY
        value: 'true'
      - key: SERVER_PROXY_IP_HEADER
        value: True-Client-IP
      # Uploads: R2 bucket and S3 API key from docs/STAGING.md.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: azway-cms-staging-uploads
      # The bucket's public r2.dev URL.
      - key: R2_PUBLIC_URL
        sync: false
      # Same values as the GitHub environment `staging`.
      - key: LEAD_INGEST_TOKEN
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      # <NEXT_PUBLIC_SITE_URL>/api/revalidate, known once the web is deployed.
      - key: WEB_REVALIDATE_URL
        sync: false
      - key: CRON_ENABLED
        value: 'false'

databases:
  - name: azway-cms-staging-db
    plan: free
    region: singapore
    postgresMajorVersion: '16'
    databaseName: strapi
    user: strapi
