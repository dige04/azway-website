name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generated Strapi types are committed so typecheck sees the real
      # content model; fail if a schema change was committed without them.
      - name: Check generated Strapi types are up to date
        run: |
          pnpm --filter @azway/cms strapi ts:generate-types
          git diff --exit-code -- apps/cms/types/generated

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build:cms

      # Next build + OpenNext Workers bundle (catches Node-only APIs), with no
      # CMS to prerender from (the smoke job builds against one).
      - run: pnpm build:web
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          BUILD_WITHOUT_CMS: '1'

      # The staging config deploy-web.yml uses bundles, without an account.
      # OPEN_NEXT_DEPLOY stops wrangler handing over to `opennextjs-cloudflare
      # deploy`, which would populate the remote cache first.
      - name: Staging deploy dry run
        working-directory: apps/web
        env:
          OPEN_NEXT_DEPLOY: 'true'
        run: pnpm exec wrangler deploy --dry-run --env staging --var CMS_URL:https://cms.example.invalid --outdir "$RUNNER_TEMP/worker"

  # TASKS M8: the CMS image builds, runs as non-root on the PORT a host gives
  # it, and serves the admin at the ADMIN_PATH baked in at build. Not pushed.
  # Run as on Render (render.yaml): Postgres, the R2 upload provider, 512 MB,
  # behind a TLS proxy that reports the client in True-Client-IP.
  cms-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: strapi
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - run: docker build -f apps/cms/Dockerfile --build-arg ADMIN_PATH=/quan-tri-ci -t azway-cms:ci .

      # NFR-07: no silent fallback to the public /admin (cached layers, fails fast).
      - name: Build without ADMIN_PATH fails
        run: |
          if docker build -f apps/cms/Dockerfile . > no-arg.log 2>&1; then echo "built without ADMIN_PATH"; exit 1; fi
          # The error itself, not BuildKit's echo of the RUN line.
          grep -F "(got '')" no-arg.log

      - name: Runs as non-root
        run: test "$(docker run --rm azway-cms:ci id -u)" != 0

      # R2: every R2_* set switches plugins.ts to the S3 provider. Its endpoint
      # host points at a closed local port, so nothing leaves the runner.
      - name: Start like render.yaml, with throwaway secrets
        run: |
          s() { openssl rand -base64 32; }
          {
            echo "APP_KEYS=$(s)"
            for name in API_TOKEN_SALT ADMIN_JWT_SECRET TRANSFER_TOKEN_SALT JWT_SECRET ENCRYPTION_KEY LEAD_INGEST_TOKEN; do echo "$name=$(s)"; done
            echo "DATABASE_CLIENT=postgres"
            echo "DATABASE_URL=postgres://strapi:strapi@127.0.0.1:5432/strapi"
            echo "R2_ACCOUNT_ID=ci-r2"
            echo "R2_ACCESS_KEY_ID=ci"
            echo "R2_SECRET_ACCESS_KEY=ci"
            echo "R2_BUCKET=ci"
            echo "R2_PUBLIC_URL=https://media.example.invalid"
            echo "CRON_ENABLED=false"
            echo "SERVER_PROXY=true"
            echo "SERVER_PROXY_IP_HEADER=True-Client-IP"
            echo "PORT=10000"
          } > cms.env
          docker run -d --name cms --network host --memory 512m --memory-swap 512m --add-host ci-r2.r2.cloudflarestorage.com:127.0.0.1 \
            --env-file cms.env azway-cms:ci
          timeout 240 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:10000/_health; do sleep 2; done'

      - name: Admin at ADMIN_PATH only
        run: |
          code() { curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:10000$1"; }
          echo "/quan-tri-ci -> $(code /quan-tri-ci), /admin -> $(code /admin)"
          test "$(code /quan-tri-ci)" = 200
          test "$(code /admin)" = 404

      # SERVER_PROXY: the proxy says the client used https, so the admin
      # session cookie must be Secure. The admin API stays under /admin.
      - name: Admin cookie is Secure behind the proxy
        run: |
          pw="$(openssl rand -hex 16)Aa1"
          body=$(printf '{"firstname":"CI","email":"ci@azway.test","password":"%s"}' "$pw")
          # First admin, as on a fresh host (docs/STAGING.md).
          curl -sSf -o /dev/null -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:10000/admin/register-admin
          headers=$(curl -sS -D - -o login.json -H 'X-Forwarded-Proto: https' -H 'Content-Type: application/json' \
            -d "$body" http://127.0.0.1:10000/admin/login)
          # Status and cookie flags only, never the token values.
          echo "$headers" | head -1
          echo "$headers" | grep -i '^set-cookie:' | sed -E 's/=[^;]*/=<hidden>/'
          echo "$headers" | head -1 | grep -q ' 200'
          echo "$headers" | grep -i '^set-cookie: strapi_admin_refresh=' | grep -qi '; *secure'

      # Render appends to a client-sent X-Forwarded-For (docs/STAGING.md), so
      # rotating it must not reset the admin login throttle (5 per 5 minutes).
      - name: Forged X-Forwarded-For does not bypass the login throttle
        run: |
          codes=""
          for i in 1 2 3 4 5 6; do
            codes="$codes $(curl -sS -o /dev/null -w '%{http_code}' -H "X-Forwarded-For: 198.51.100.$i" \
              -H 'Content-Type: application/json' -d '{"email":"throttle@azway.test","password":"wrong-password-1A"}' \
              http://127.0.0.1:10000/admin/login)"
          done
          echo "attempts:$codes"
          test "${codes##* }" = 429

      # The S3 provider is the one in use: the upload tries R2 (refused here)
      # and fails, the local provider would have stored it. Strapi stays up.
      - name: Uploads go to the R2 provider; an unreachable R2 does not crash Strapi
        run: |
          token=$(jq -r .data.token login.json)
          code=$(curl -sS -o upload.json -w '%{http_code}' -H "Authorization: Bearer $token" \
            -F files=@apps/cms/favicon.png http://127.0.0.1:10000/upload)
          echo "POST /upload -> $code"
          docker logs cms 2>&1 | grep -m 3 -iE 'ECONNREFUSED|r2\.cloudflarestorage' || true
          test "$code" = 500
          curl -sSf -o /dev/null http://127.0.0.1:10000/_health

      - name: Memory under the 512 MB limit
        run: docker stats --no-stream --format 'MEM {{.MemUsage}} ({{.MemPerc}})' cms

      - if: failure()
        run: docker logs cms

  # TASKS M5 "Xong khi": every route renders with seed data at 375px and
  # 1440px without console errors. Seeded local Strapi + Workers preview.
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_CLIENT: sqlite
      HOST: 127.0.0.1
      PORT: '1337'
      CMS_URL: http://127.0.0.1:1337
      NEXT_PUBLIC_SITE_URL: http://localhost:8787
      # Not a real property: e2e/analytics.spec.ts needs GA on; e2e/test.ts
      # stubs Google's hosts, so nothing is sent.
      NEXT_PUBLIC_GA_ID: G-E2ETEST000
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Throwaway CMS secrets
        run: |
          s() { openssl rand -base64 32; }
          {
            echo "APP_KEYS=$(s),$(s)"
            for name in API_TOKEN_SALT ADMIN_JWT_SECRET TRANSFER_TOKEN_SALT JWT_SECRET ENCRYPTION_KEY LEAD_INGEST_TOKEN REVALIDATE_SECRET; do echo "$name=$(s)"; done
            # Admin login for e2e/lead.spec.ts to read leads back.
            echo "E2E_ADMIN_EMAIL=e2e@azway.test"
            echo "E2E_ADMIN_PASSWORD=$(openssl rand -hex 16)Aa1"
          } >> "$GITHUB_ENV"

      - run: pnpm build:cms

      # In-process Strapi like the seed: before the server starts, or the two lock the SQLite file.
      - name: E2E admin user
        run: pnpm --filter @azway/cms exec strapi admin:create-user --firstname=E2E --email="$E2E_ADMIN_EMAIL" --password="$E2E_ADMIN_PASSWORD"

      # The seed loads Strapi in-process on the same SQLite file, so it runs
      # (and exits) before the server starts: two writers lock the database.
      - name: Seed, then start Strapi
        run: |
          # Only the logo is in the repo; other images are skipped with a warning.
          SEED_ASSETS_DIR=design/assets pnpm --filter @azway/cms seed
          # The webhook reaches the preview once it is up (e2e/redirect.spec.ts).
          WEB_REVALIDATE_URL=http://localhost:8787/api/revalidate pnpm --filter @azway/cms start > strapi.log 2>&1 &
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:1337/_health; do sleep 2; done'

      - name: Build and start the Workers preview
        working-directory: apps/web
        run: |
          printf 'CMS_URL=%s\nLEAD_INGEST_TOKEN=%s\nREVALIDATE_SECRET=%s\n' "$CMS_URL" "$LEAD_INGEST_TOKEN" "$REVALIDATE_SECRET" > .dev.vars
          pnpm build:worker
          pnpm exec opennextjs-cloudflare preview > preview.log 2>&1 &
          timeout 120 bash -c 'until curl -sf -o /dev/null http://localhost:8787/; do sleep 2; done'

      # D5: LEAD_INGEST_TOKEN is in this job's env during the build; it must not reach the browser.
      - name: Lead token is not in the browser bundle
        working-directory: apps/web
        run: |
          # Both must exist (one test per line: under bash -e only a line's own failure stops the step).
          test -d .next/static
          test -d .open-next/assets
          # grep: 0 = found (leak), 1 = not found, anything else = could not check.
          grep -rlF -e "$LEAD_INGEST_TOKEN" .next/static .open-next/assets && status=0 || status=$?
          case "$status" in
            1) echo "LEAD_INGEST_TOKEN is not in the client assets" ;;
            0) echo "LEAD_INGEST_TOKEN found in the client assets above"; exit 1 ;;
            *) echo "grep failed (exit $status)"; exit 1 ;;
          esac

      - name: Playwright browser
        run: pnpm --filter @azway/web exec playwright install --with-deps chromium

      - run: pnpm --filter @azway/web smoke

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: |
            strapi.log
            apps/web/preview.log
            apps/web/test-results/
          if-no-files-found: ignore
