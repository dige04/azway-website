name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generated Strapi types are committed so typecheck sees the real
      # content model; fail if a schema change was committed without them.
      - name: Check generated Strapi types are up to date
        run: |
          pnpm --filter @azway/cms strapi ts:generate-types
          git diff --exit-code -- apps/cms/types/generated

      - run: pnpm typecheck

      - run: pnpm test

      # One step per app; add `pnpm build:web` when apps/web lands.
      - run: pnpm build:cms
